<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de curso</title>
    <link rel="stylesheet" href="ejercicio1.css">
</head>
<body>
    
    <div class="Contenedor"> 
        <h1>Formulario de Cursos</h1>
        <form action="https://formsubmit.co/jhontanramos756@gmail.com" method="post">

            <div class="hijo">
                <label for="nombre">Nombres:</label>  
                <input type="text" id="nombre" name="nombre" placeholder="Ingrese sus nombres">
            </div>

            <div class="hijo">
                <label for="apellidos">Apellidos:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ingrese sus nombres">
            </div>
            <div class="hijo">
                <label for="horario">Selleccionar Horarios:</label>
                <select id="horario" name="horario" multiple required size="3" >
                    <option value="Mañana">Mañana</option>
                    <option value="Tarde">Tarde</option>
                    <option value="Noche">Noche</option>
                </select>
            </div>
            <div class="hijo">
                <label for="cursos">Seleccionar cursos:</label>
                <select  id="cursos" name="cursos" multiple required size="6">
                    <option value="Python">Pyhton</option>
                    <option value="Java">Java</option>
                    <option value="html">HTML</option>
                    <option value="css">CSS</option>
                    <option value="JavaScript">JavaScript</option>
                    <option value="C">C</option>
                </select>
                <small>Seleccione CTRL para unop o más productos</small>
                <label for="observaciones">Observaciones:</label>
                <textarea id="observaciones" name="observaciones" placeholder="Ingrese observaciones sobre su pedido" rows="10"></textarea>
                <button type="submit">Enviar Pedido</button>    
            </div>
        </form>
    </div>
</body>
</html>
