    <!-- FORMULARIO DE CONSULTAS -->
    <div class="contenedor">
        <h2>Envíanos tu Consulta</h2>
        <form action="https://formsubmit.co/jhontanramos756@gmail.com" method="post">
            <!-- Protección básica contra spam -->
            <input type="hidden" name="_captcha" value="false">
            <input type="hidden" name="_template" value="table">

            <div class="grupo">
                <label for="nombre">Nombre completo:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre y apellido" required>
            </div>

            <div class="grupo">
                <label for="correo">Correo electrónico:</label>
                <input type="email" id="correo" name="correo" placeholder="ejemplo@dominio.com" required>
            </div>

            <div class="grupo">
                <label for="asunto">Asunto:</label>
                <input type="text" id="asunto" name="asunto" placeholder="Motivo de tu consulta" required>
            </div>

            <div class="grupo">
                <label for="telefono">Teléfono de contacto (opcional):</label>
                <input type="tel" id="telefono" name="telefono" placeholder="+51 999 999 999">
            </div>

            <div class="grupo">
                <label for="tipo">Tipo de consulta:</label>
                <select id="tipo" name="tipo" required>
                    <option value="">Selecciona una opción</option>
                    <option value="informacion">Solicitud de información</option>
                    <option value="queja">Reclamo o queja</option>
                    <option value="sugerencia">Sugerencia</option>
                    <option value="otro">Otro</option>
                </select>
            </div>

            <div class="grupo">
                <label for="mensaje">Mensaje:</label>
                <textarea id="mensaje" name="mensaje" placeholder="Describe tu consulta en detalle..." required></textarea>
            </div>

            <button type="submit">Enviar Consulta</button>
        </form>
    </div>

    
    <footer>
        <h2>@Todos los Derechos Reservados 2026</h2>
    </footer>
</body>
</html>
